<template>
    <ul>
        <template for:each={todos} for:item="t">
            <li key={t.id} class={t.rowClass}>
                <lightning-input
                    type="checkbox"
                    label={t.text}
                    checked={t.done}
                    data-id={t.id}
                    onchange={handleToggle}
                ></lightning-input>
            </li>
        </template>
    </ul>
</template>
