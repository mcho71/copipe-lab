<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jev-ui ホーム画面</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>
  <body class="flex h-dvh flex-col overflow-hidden bg-neutral-100 text-neutral-900 antialiased">
    <header class="flex items-center justify-between px-6 py-3 text-sm text-neutral-500">
      <span id="progress" class="tabular-nums">– / 30</span>
      <span id="jev-ms" class="tabular-nums">Jev –</span>
    </header>

    <main class="relative min-h-0 flex-1 px-6">
      <div
        id="frame"
        class="relative mx-auto h-full max-w-2xl cursor-grab touch-none select-none overflow-auto rounded-3xl border border-neutral-200 bg-neutral-50 p-4 shadow-sm"
      >
        <div id="screen" class="grid grid-cols-2 content-start gap-3"></div>
        <div
          id="stamp"
          class="pointer-events-none absolute left-1/2 top-8 -translate-x-1/2 rounded-full border-2 border-neutral-900 bg-white px-5 py-1 text-xl font-bold opacity-0"
        ></div>
      </div>
      <div
        id="loading"
        class="pointer-events-none absolute inset-0 flex items-center justify-center text-neutral-400 opacity-0 transition-opacity"
      >
        Jev が次の画面案を選んでいます…
      </div>
    </main>

    <footer class="mx-auto w-full max-w-2xl px-6 pb-5 pt-3">
      <input
        id="hitokoto"
        type="text"
        maxlength="200"
        autocomplete="off"
        placeholder="一言（打たなくても進めます） 例: もっとスッキリ"
        class="w-full rounded-xl border border-neutral-300 bg-white px-4 py-3 outline-none focus:border-neutral-900"
      />
      <div class="mt-3 grid grid-cols-3 gap-3 text-sm">
        <button data-rating="meh" class="rounded-xl border border-neutral-300 bg-white py-2 hover:border-neutral-900">← いまいち</button>
        <button data-rating="kore" class="rounded-xl bg-neutral-900 py-2 font-semibold text-white hover:bg-neutral-700">↑ これ！</button>
        <button data-rating="like" class="rounded-xl border border-neutral-300 bg-white py-2 hover:border-neutral-900">好き →</button>
      </div>
      <p id="message" class="mt-2 min-h-5 text-center text-xs text-neutral-400">
        一言を打ったら Enter で確定、矢印キーかドラッグでスワイプ
      </p>
    </footer>

    <div id="summary" class="fixed inset-0 hidden items-center justify-center bg-neutral-900/40 p-6">
      <div class="w-full max-w-xl rounded-3xl bg-white p-8 shadow-xl">
        <h1 class="text-xl font-semibold">30 スワイプの集計</h1>
        <dl id="summary-body" class="mt-6 space-y-4"></dl>
        <button id="restart" class="mt-8 w-full rounded-xl bg-neutral-900 py-3 font-semibold text-white">もう一度試す</button>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
